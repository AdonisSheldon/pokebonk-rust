<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PokéBonk</title>
  <style>
    :root { color-scheme: light; --cream: #f5f1e8; --ink: #303048; --red: #ef5350; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: var(--cream); color: var(--ink); font: 14px system-ui, sans-serif; user-select: none; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    h1 { margin: 0; font-size: 25px; font-weight: 800; letter-spacing: -.5px; }
    #version { margin-left: auto; font-size: 12px; opacity: .65; }
    .ball { position: relative; width: 34px; height: 34px; border: 3px solid var(--ink); border-radius: 50%; background: linear-gradient(var(--red) 45%, var(--ink) 45%, var(--ink) 55%, #fff 55%); }
    .ball::after { content: ''; position: absolute; inset: 9px; border: 2px solid var(--ink); border-radius: 50%; background: #fff; }
    .status { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    #stage { margin: 0; font-weight: 600; }
    #percentage { font-variant-numeric: tabular-nums; }
    progress { display: block; width: 100%; height: 18px; appearance: none; border: 2px solid var(--ink); border-radius: 3px; background: #e2ddcf; overflow: hidden; }
    progress::-webkit-progress-bar { background: #e2ddcf; }
    progress::-webkit-progress-value { background: var(--red); }
    progress::-moz-progress-bar { background: var(--red); }
    progress:indeterminate { background: repeating-linear-gradient(110deg, #e2ddcf 0 14px, var(--red) 14px 28px); background-size: 56px 100%; animation: busy 1s linear infinite; }
    progress:indeterminate::-webkit-progress-bar { background: transparent; }
    #amount { margin: 10px 0 0; min-height: 18px; font-size: 12px; opacity: .65; font-variant-numeric: tabular-nums; }
    @keyframes busy { to { background-position: 56px 0; } }
    @media (prefers-reduced-motion: reduce) { progress:indeterminate { animation: none; } }
  </style>
</head>
<body>
  <header><span class="ball" aria-hidden="true"></span><h1>PokéBonk</h1><span id="version"></span></header>
  <div class="status"><p id="stage" role="status" aria-live="polite"></p><span id="percentage" aria-hidden="true"></span></div>
  <progress id="progress" max="100" aria-labelledby="stage"></progress>
  <p id="amount"></p>
  <script src="update-progress.js"></script>
</body>
</html>
